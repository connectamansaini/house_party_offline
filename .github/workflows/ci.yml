name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the app is built with locally, so CI never
      # drifts from the release toolchain.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated (freezed / injectable) files are committed, so a stale one
      # shows up here as a diff rather than a mystery compile error.
      - name: Verify generated code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code --stat -- lib test || {
            echo "::error::Generated files are out of date. Run build_runner and commit the result."
            exit 1
          }

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded
