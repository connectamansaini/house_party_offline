include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Generated by build_runner (freezed / json_serializable / injectable).
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
  errors:
    # Generated part directives reference files that only exist after codegen.
    uri_has_not_been_generated: ignore

linter:
  rules:
    # This app has no public API surface — it is not a package. Documenting
    # every public member would be noise, so docs are required by review, not
    # by the analyzer.
    public_member_api_docs: false
